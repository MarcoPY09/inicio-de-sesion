<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro/inicio</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="codigo.js"></script>
</head>

<body>
    <div class="principal">

        <center>
            <img src="icono.png" alt="">
            <div class="registro">

                <div class="centrar">
                    <center>
                        <h1>Registro</h1>
                        <h2>Usuario:</h2><br>
                        <input type="text" id="Usuario" placeholder="Escribe tu usuario"><br>
                        <h2>Contraseña</h2>
                        <input type="password" id="Contraseña" placeholder="Escribe tu contraseña"><br>
                        <button onclick="validarRegistro()">Registrar nuevo usuario</button>
                    </center>
                </div>
            </div>
             <center><div class="texto"><h2>Ya tienes cuenta?</h2> <button>Iniciar sesión</button></div></center>
        </center>


        <div class="inicio">
                    <center>
            <img src="icono.png" alt="">
            <div class="registro">

                <div class="centrar">
                    <center>
                        <h1>Inicio de Sesión</h1>
                        <h2>Usuario:</h2><br>
                        <input type="text" id="Usuario" placeholder="Escribe tu usuario"><br>
                        <h2>Contraseña</h2>
                        <input type="password" id="Contraseña" placeholder="Escribe tu contraseña"><br>
                        <button onclick="iniciarSesión()">Ingresar</button>
                    </center>
                </div>
            </div>
        </center>
        </div>
        <div>
</body>

</html>
